[package]
name = "switchhosts-fnos"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
default-run = "switchhosts-fnos"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs2 = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = true
strip = true
